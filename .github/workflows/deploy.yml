# CRM frontendni Cloudflare Workers'ga avtomatik chiqarish.
#
# Shu paytgacha deploy faqat qo'lda qilingan: kimdir o'z noutbukidan
# `npm run deploy` yozardi. Oxirgi marta 24-avgustda qilingan — ya'ni
# `main`ga qo'shilgan kod ikki hafta productionga chiqmay turgan.
#
# Endi: `main`ga push -> sifat darvozasi -> deploy. PR'da faqat tekshiruv (+ Playwright e2e).
#
# TEST muhit (staging): `test`ga push -> o'sha sifat darvozasi -> `npm run build:staging` (`.env.staging`, test API)
# -> `npx wrangler deploy --env staging` -> ALOHIDA Worker `elchi-frontend-test`, https://test-admin.elchipochta.uz.
# Oqim: dev -> test (merge) -> staging; test -> main (merge) -> production (avvalgidek).
# Staging deploy faqat repo o'zgaruvchisi `STAGING_ENABLED` = `true` bo'lganda (Settings -> Secrets and variables ->
# Actions -> Variables). Test backend (test-api.elchipochta.uz) tayyor bo'lmaguncha o'zgaruvchi qo'yilmaydi:
# `test`ga push faqat tekshiruv + staging build'ini yuradi, hech narsa chiqmaydi.
# `main`/production yo'li o'zgarmagan: `test`da production build ham, production deploy ham yurmaydi; har deploy
# oldidan `npm run check:target` build aynan o'z muhitiniki ekanini tekshiradi (production <-> staging adashmaydi).
#
# Kerakli GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" shablonidagi token (staging ham shu token bilan; custom domen
#                            test-admin.elchipochta.uz uchun elchipochta.uz zonasida Workers Routes / DNS ruxsati)
#   CLOUDFLARE_ACCOUNT_ID  — akkaunt id (`npx wrangler whoami` ko'rsatadi)
# Variables: STAGING_ENABLED — `true` bo'lsa `test` branchi staging'ga chiqadi (sukut: yo'q — staging o'chiq).
#
# Build uchun qo'shimcha sir kerak emas: `.env.production` repoda turadi va
# ichida faqat ochiq qiymatlar bor (VITE_* baribir bundle'ga tushadi).

name: Deploy

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

# Bir branchda ikkita deploy bir vaqtda ketmasin. main'da (va test'da) `cancel-in-progress`
# o'chirilgan — productionga (staging'ga) chiqish yarim yo'lda uzilib qolmasligi kerak.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/test' }}

jobs:
  deploy:
    # `ubuntu-latest` 2026-10 dan Ubuntu 26.04 (runner image 20261021): Playwright 1.59 unda Chromium o'rnatmaydi
    # («Playwright does not support chromium on ubuntu26.04-x64») — PR'dagi e2e qadami yiqiladi. Playwright yangi
    # OS'ni qo'llamaguncha 24.04 da qotirilgan. «Visual» o'z konteynerida (noble) yuradi — unga ta'sir yo'q.
    runs-on: ubuntu-24.04
    # PR'da to'liq sifat darvozasi va 599+ e2e testi yuradi; 30 daqiqalik limit testlarni tugashidan oldin bekor qilardi.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # To'liq tarix: PR'da dizayn qo'riqchisi (`--diff`) base branch bilan merge-base topadi.
          # (`cond && 0 || 1` ishlatilmaydi — GitHub ifodalarida 0 "false", natija doim 1 bo'lardi.)
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Sifat darvozasi — yiqilsa deploy umuman boshlanmaydi.
      - run: npm run lint
      - run: npm test

      # Dizayn v2: PR'da QO'SHILGAN qatorlarda yangi buzilish bo'lmasin (AGENTS.md «Dizayn qo'riqchisi»).
      # `npm test` dagi ratchet fayl × qoida sonini tekshiradi; bu qadam esa eskisini o'chirib yangisini
      # qo'shish ("almashtirish") ni ham ushlaydi.
      - name: Dizayn qo'riqchisi (PR diff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          npm run design:guard -- --diff "origin/${BASE_REF}"

      # `npm run build` = `tsc -b && vite build`, ya'ni tip tekshiruvi shu yerda.
      # `test` branchida production build'i yo'q — o'rniga staging (quyida), production deploy ham yo'q.
      - run: npm run build
        if: github.ref != 'refs/heads/test'

      # TEST muhit: `tsc -b && vite build --mode staging` (`.env.staging` — test API, «TEST muhit» belgisi, noindex).
      - name: Build (staging)
        if: github.ref == 'refs/heads/test'
        run: npm run build:staging

      # Bundle byudjeti: entry ≤ 600 KB gzip, index.html da jsPDF yo'q.
      - run: npm run check:bundle

      # `dist` aynan o'z muhitining build'i: API hosti (_headers CSP, JS), noindex, «[TEST]», manifest, robots.txt.
      # Staging build'i production'ga (yoki aksincha) hech qachon chiqmasin.
      - name: Deploy maqsadi (dist ↔ muhit)
        run: npm run check:target -- ${{ github.ref == 'refs/heads/test' && 'staging' || 'production' }}

      # PR'da staging build'i ham yig'ilib tekshiriladi (alohida papkada — `dist` production'niki bo'lib qoladi):
      # `.env.staging` / vite.config.ts / public/* dagi o'zgarish staging'ni buzsa, `test`ga merge'dan oldin ko'rinadi.
      - name: Staging build (tekshiruv)
        if: github.event_name == 'pull_request'
        run: |
          npx vite build --mode staging --outDir "$RUNNER_TEMP/dist-staging" --emptyOutDir --logLevel warn
          npm run check:target -- staging "$RUNNER_TEMP/dist-staging"

      # E2E (Playwright, tests/e2e) — faqat PR'da, yiqilsa merge bo'lmaydi (ega qarori 2026-10-17).
      # API so'rovlari testlarning o'zida mock qilinadi (tests/e2e/support/*), backend kerak emas;
      # dev server'ni playwright.config.ts dagi `webServer` o'zi ko'taradi. Ilgari e2e faqat lokalda
      # yurardi va dizayn v2 bosqichlarida 18 ta test jimgina sinib qolgan edi.
      - name: Playwright brauzeri keshi
        if: github.event_name == 'pull_request'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright brauzerini o'rnatish
        if: github.event_name == 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright tizim kutubxonalari (keshdan)
        if: github.event_name == 'pull_request' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (Playwright)
        if: github.event_name == 'pull_request'
        # Ilova vaqtni brauzer mahalliy vaqtida ko'rsatadi; foydalanuvchilar va lokal muhit — Toshkent.
        # Runner UTC'da edi → «18:00» kutgan testlar «13:00» ko'rardi (realtime-shift). Node ham, Chromium ham TZ dan oladi.
        env:
          TZ: Asia/Tashkent
        run: npx playwright test --reporter=line

      - name: E2E natijalari (yiqilganda)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      # Wrangler package.json dagi versiyadan olinadi (npm ci o'rnatgan), ya'ni
      # versiya bitta joyda turadi va workflow repodan uzilib qolmaydi.
      # Konfiguratsiya `wrangler.jsonc` dan o'qiladi: Worker nomi elchi-frontend,
      # `dist` esa static asset sifatida yuklanadi.
      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # TEST muhit: `wrangler.jsonc` → `env.staging` — Worker `elchi-frontend-test`, test-admin.elchipochta.uz.
      # `--env staging` siz chaqirilmaydi: production Worker'ga tegmaydi. Faqat `STAGING_ENABLED` = `true` bo'lsa.
      - name: Deploy (staging)
        if: github.ref == 'refs/heads/test' && vars.STAGING_ENABLED == 'true'
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Staging o'chiq (deploy qilinmadi)
        if: github.ref == 'refs/heads/test' && vars.STAGING_ENABLED != 'true'
        run: |
          echo "::notice title=Staging::STAGING_ENABLED != true — test-admin.elchipochta.uz ga deploy qilinmadi (build va tekshiruvlar o'tdi)."
          echo "Staging o'chiq: repo o'zgaruvchisi \`STAGING_ENABLED\` = \`true\` emas — deploy qilinmadi (Settings → Secrets and variables → Actions → Variables)." >> "$GITHUB_STEP_SUMMARY"
