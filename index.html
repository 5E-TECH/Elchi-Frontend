<!doctype html>

  <head>
    <script>
      (() => {
        try {
          if (location.pathname === "/" && !sessionStorage.getItem("accessToken") && !localStorage.getItem("elchi_had_session")) {
            sessionStorage.setItem("elchi_root_restore", "1");
            history.replaceState(history.state, "", "/login");
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <!--
      Yuqoridagi skript (hammasidan OLDIN — `firstPaintPreload`, mavzu skripti va `src/i18n.ts` manzilni o'qishidan
      oldin; ASCII, chunki `<meta charset>` dan oldin turadi): qidiruvdan «/» ga kelgan, bu qurilmada sessiya belgisi
      (`elchi_had_session`, `auth/authService.ts`) yo'q tashrifchi darhol `/login` ning tez yo'lida ochiladi —
      birinchi kadr, kirish sahifasi chunklari parallel, tarjimalarning qolgani kechiktirilgan. Sekin 3G'da «/» 14 s bo'sh
      ekran va forma 20 s da edi. Cookie sessiyasi bo'lsa ham qayta kirish shart emas: `elchi_root_restore` bilan
      `initAuth` uni fonda tiklaydi va kirish sahifasi «/» ga o'tkazadi.
    -->
    <!-- Logotip — yuklanish ekrani va /login dagi eng katta element (LCP, rzzxMItN): JS kutmasdan, darhol so'raladi. -->
    <link rel="preload" as="image" href="/src/shared/assets/brand/elchi-logo-white.png" fetchpriority="high" />

    <!-- ═══════════════════ Theme Init (FOUC prevention) ═══════════════════ -->
    <script>
      (() => {
        let savedTheme;
        try {
          // Dizayn v2: faqat "theme-version" = 2 bilan yozilgan tanlov hurmat qilinadi
          // (preferencesStorage.ts — eski avtomatik "dark" sukutni e'tiborsiz qoldiradi).
          savedTheme = localStorage.getItem("theme-version") === "2" ? localStorage.getItem("theme") : null;
        } catch {
          // Dizayn v2: sukut — LIGHT; dark faqat aniq tanlanganda.
        }
        document.documentElement.classList.add(savedTheme === "dark" ? "dark" : "light");
        // `/login` birinchi kadri (#login-shell) — faqat shu yo'lda ko'rinadi.
        if (/^\/login\/?$/i.test(location.pathname)) document.documentElement.classList.add("login-first-paint");
      })();
    </script>

    <!-- ═══════════════════ Zaxira bloklar (js9ndYwA) ═══════════════════ -->
    <!--
      Ilova kodi ishga tushmasa — oq ekran emas, zaxira blok. CSS yuklanmasdan chiqadi, shuning uchun uslub shu yerda,
      v2 qiymatlarida (taxta tizim-errors). TAYMER YO'Q: sekin internetda (EDGE'da yuklanish 23–43 s) blok o'z-o'zidan
      chiqmaydi — faqat aniq belgi bo'yicha:
        - «Brauzeringiz eskirgan» — sintaksis sinovi: birinchi skript ES2020 `??` bilan (= `vite.config.ts` build.target
          es2020). Uni tushunmaydigan brauzer (Chrome < 80, Safari < 13.1, IE) skriptni butunlay o'tkazib yuboradi,
          ikkinchi skript (ES5) `<html>` ga `elchi-legacy` qo'yadi. Tarmoqqa bog'liq emas, birinchi kadrdayoq.
        - «Ilovani yuklab bo'lmadi» — ilova moduli (main.tsx yoki uning statik importi) yuklanmadi
          (tarmoq / HTTP xatosi) yoki ishga tushguncha o'z faylimizda xato: `elchi-boot-failed`; internet qaytsa
          (`online`) sahifa o'zi qayta yuklanadi.
      main.tsx ishga tushishi bilan ikkala blokni o'chiradi — kuzatuvchi shundan keyin hech narsa qilmaydi (keyingi
      xatolar — ErrorBoundary / chunkError). CSP: ichki skriptlar xeshi build'da hisoblanadi (scripts/csp-headers.mjs);
      `eval` / `new Function` / `onclick=` yo'q. Ikkinchi skript ES5 (vergul bilan tugaydigan argument ham yo'q) —
      `src/test/indexHtml.test.ts` acorn bilan tekshiradi. Uslub eski Safari'da ham ishlaydi: `inset` va flex `gap` yo'q.
    -->
    <script>window.elchiModernJs = null ?? true;</script>
    <!-- prettier-ignore -->
    <script>
      (function () {
        var root = document.documentElement;
        if (window.elchiModernJs !== true) {
          root.className += " elchi-legacy";
          return;
        }
        function failed() {
          if (!document.getElementById("boot-fallback") || / elchi-boot-failed/.test(root.className)) return;
          root.className += " elchi-boot-failed";
          window.addEventListener("online", function () { location.reload(); });
        }
        window.addEventListener("error", function (event) {
          var target = event.target;
          var file = String(event.filename || "").split(/[?#]/)[0];
          if (target && target.tagName === "SCRIPT" && target.type === "module") failed();
          else if (file.indexOf(location.origin + "/") === 0 && /\.(m?js|jsx|tsx?)$/.test(file)) failed();
        }, true);
      })();
    </script>
    <style>
      .elchi-fallback {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f4f6fb;
        color: #101733;
        font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

      #legacy-fallback,
      #boot-fallback {
        display: none;
      }
      .elchi-legacy #legacy-fallback,
      .elchi-boot-failed #boot-fallback {

      /* Faqat Vite dev server: kompilyatsiya xatosi (modul 500) zaxira blok USTIDA ko'rinsin — «internetni tekshiring»

      vite-error-overlay {
        z-index: 2147483647;
      }

      }
      .elchi-fallback__text {

        color: #4b5575;

      .elchi-fallback__action {

        border-radius: 10px;
        background: #1f2853;
        color: #ffffff;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>

    <!-- ═══════════════════ /login birinchi kadri (rzzxMItN) ═════════════════════════ -->
    <!--

      Matn yo'q: til hali noma'lum. Balandliklar: tasma 180 px = 40 + logotip 48 + 92, forma qismi 391 px (planshetda
      395 px) — ortiqcha joy 2:1 bo'linadi, sahifadagidek. Sahifa tuzilishi o'zgarsa, shu yerga ham ko'chiriladi
      (`login-first-paint.preview.spec.ts` farqni ushlaydi).
    -->
    <style>

        }
      }
      @media (max-width: 767px) {

        }
      }
    </style>
  </head>
