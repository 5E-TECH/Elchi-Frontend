<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!-- Logotip — yuklanish ekrani va /login dagi eng katta element (LCP, rzzxMItN): JS kutmasdan, darhol so'raladi. -->
    <link rel="preload" as="image" href="/src/shared/assets/brand/elchi-logo-white.png" fetchpriority="high" />

    <!-- ═══════════════════ Viewport & Basic ═══════════════════ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- ═══════════════════ Primary SEO ═══════════════════ -->

    <meta
      name="keywords"

    />
    <meta name="author" content="Elchi Pochta" />
    <link rel="canonical" href="https://elchi.uz/" />

    <!-- ═══════════════════ Open Graph (Facebook, Telegram) ═══════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elchi.uz/" />
    <meta property="og:site_name" content="Elchi Pochta" />
    <meta property="og:title" content="Elchi Pochta — Logistika va Kuryer Xizmati" />
    <meta
      property="og:description"
      content="O'zbekiston bo'ylab tezkor va ishonchli kuryer va logistika xizmati. Buyurtmalarni kuzatish, pochta jo'natish, va yetkazib berish tizimi."
    />
    <meta property="og:image" content="https://elchi.uz/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="uz_UZ" />

    <!-- ═══════════════════ Twitter Card ═══════════════════ -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Elchi Pochta — Logistika va Kuryer Xizmati" />
    <meta
      name="twitter:description"
      content="O'zbekiston bo'ylab tezkor va ishonchli kuryer va logistika xizmati."
    />
    <meta name="twitter:image" content="https://elchi.uz/icon-512.png" />

    <!-- ═══════════════════ Icons & PWA ═══════════════════ -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f2853" />

    <!-- ═══════════════════ Shrift: Manrope (dizayn v2) ═══════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Elchi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Elchi Pochta" />
    <meta name="msapplication-TileColor" content="#1f2853" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- ═══════════════════ Structured Data (JSON-LD) ═══════════════════ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Elchi Pochta",
        "url": "https://elchi.uz",
        "logo": "https://elchi.uz/icon-512.png",
        "description": "O'zbekiston bo'ylab tezkor va ishonchli kuryer va logistika xizmati",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "UZ"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service"
        },
        "sameAs": []
      }
    </script>

    <!-- ═══════════════════ Theme Init (FOUC prevention) ═══════════════════ -->
    <script>
      (() => {
        let savedTheme;
        try {
          // Dizayn v2: faqat "theme-version" = 2 bilan yozilgan tanlov hurmat qilinadi
          // (preferencesStorage.ts — eski avtomatik "dark" sukutni e'tiborsiz qoldiradi).
          savedTheme = localStorage.getItem("theme-version") === "2" ? localStorage.getItem("theme") : null;
        } catch {
          // Dizayn v2: sukut — LIGHT; dark faqat aniq tanlanganda.
        }
        document.documentElement.classList.add(savedTheme === "dark" ? "dark" : "light");
        // `/login` birinchi kadri (#login-shell) — faqat shu yo'lda ko'rinadi.
        if (/^\/login\/?$/i.test(location.pathname)) document.documentElement.classList.add("login-first-paint");
      })();
    </script>

    <!-- ═══════════════════ Zaxira blok (js9ndYwA) ═══════════════════ -->
    <!--
      Ilova kodi ishga tushmasa (eski brauzer, JS o'chiq) — CSS yuklanmasdan chiqadi, shuning uchun uslub shu yerda,
      v2 qiymatlarida (taxta tizim-errors → «Ilova xatosi»: ikonka, sarlavha, keyingi qadam). #legacy-fallback ni
      ilova kodi ishga tushishi bilan main.tsx o'chiradi; 8 soniyagacha yashirin — oddiy yuklanishda ko'rinib qolmasin.
      Uslub eski Safari'da ham ishlaydi: `inset` va flex `gap` yo'q (iOS 14.1 dan oldin qo'llab-quvvatlanmaydi).
    -->
    <style>
      .elchi-fallback {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f4f6fb;
        color: #101733;
        font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #legacy-fallback {
        visibility: hidden;
        animation: elchi-legacy-fallback 0s linear 8s forwards;
      }
      @keyframes elchi-legacy-fallback {
        to {
          visibility: visible;
        }
      }
      .elchi-fallback__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 440px;
        padding: 40px 24px;
        border: 1px solid #e1e6f0;
        border-radius: 14px;
        background: #ffffff;
        text-align: center;
      }
      .elchi-fallback__card > * + * {
        margin-top: 12px;
      }
      .elchi-fallback__icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: #1f2853;
        color: #ffffff;
      }
      .elchi-fallback__title {
        margin: 0;
        font-size: 20px;
        line-height: 28px;
        font-weight: 700;
      }
      .elchi-fallback__text {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: #4b5575;
      }
    </style>

    <!-- ═══════════════════ /login birinchi kadri (rzzxMItN) ═════════════════════════ -->
    <!--
      Sekin tarmoqda kuryer logotipni JS'ni kutmasdan ko'radi: navy tasma va logotip — `features/auth/index.tsx` dagi
      sahifa bilan bir xil joyda (React kelganda sakramaydi), `createRoot` birinchi chizishda #root ni o'zi tozalaydi.
      Matn yo'q: til hali noma'lum. Balandliklar: tasma 180 px = 40 + logotip 48 + 92, forma qismi 391 px (planshetda
      395 px) — ortiqcha joy 2:1 bo'linadi, sahifadagidek. Sahifa tuzilishi o'zgarsa, shu yerga ham ko'chiriladi
      (`login-first-paint.preview.spec.ts` farqni ushlaydi).
    -->
    <style>
      #login-shell {
        display: none;
      }
      .login-first-paint #login-shell {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--color-surface, #ffffff);
      }
      .login-shell__brand {
        flex: 0 0 42%;
        box-sizing: border-box;
        max-width: 620px;
        padding: 48px 56px;
        background: var(--color-nav, #1f2853);
      }
      .login-shell__brand img {
        display: block;
        width: 145px;
        height: 48px;
      }
      @media (max-width: 1023px) {
        .login-first-paint #login-shell {
          flex-direction: column;
        }
        .login-shell__brand {
          display: flex;
          flex: 2 1 auto;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          max-width: none;
          padding: 40px 16px 92px;
        }
        .login-shell__rest {
          flex: 1 1 auto;
          height: 395px;
        }
      }
      @media (max-width: 767px) {
        .login-shell__rest {
          height: 391px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="login-shell" aria-hidden="true">
        <div class="login-shell__brand">
          <img src="/src/shared/assets/brand/elchi-logo-white.png" alt="" width="145" height="48" />
        </div>
        <div class="login-shell__rest"></div>
      </div>
    </div>
    <div id="legacy-fallback" class="elchi-fallback" role="alert">
      <div class="elchi-fallback__card">
        <span class="elchi-fallback__icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        <p class="elchi-fallback__title">Brauzeringiz eskirgan.</p>
        <p class="elchi-fallback__text">Iltimos, Safari yoki Chrome'ni yangilang.</p>
      </div>
    </div>
    <noscript>
      <style>
        #legacy-fallback {
          display: none;
        }
      </style>
      <div class="elchi-fallback">
        <div class="elchi-fallback__card">
          <span class="elchi-fallback__icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
          <p class="elchi-fallback__title">Ilova ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
