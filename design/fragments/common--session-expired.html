<!-- Height: a real device fills the viewport (100vh); on the canvas the frame is capped to a device screen: phone 844, tablet 1024, desktop 900. -->
<div style="min-height: min(100vh, 1024px, 2340px - 100cqw, 610px + 60cqw); display: flex; flex-direction: column; background: var(--bg)">

  <header style="display: flex; align-items: center; gap: 12px; padding: 20px clamp(16px, 3cqw, 32px)">
    <span style="width: 40px; height: 40px; border-radius:10px; background: var(--sidebar); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; flex: none">
      <img src="/_blob/e1f00e084ded5f41b8d7023517fa5b2c" alt="Elchi Pochta" width="24" height="22" style="display: block">
    </span>
    <span class="el-h3">Elchi CRM</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 24px 16px 48px">
    <section class="el-card" aria-labelledby="session-title" style="width: min(440px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px; padding: 40px clamp(20px, 4cqw, 32px) 32px">

      <span class="el-empty-icon" style="width: 56px; height: 56px; margin: 0; background: var(--warning-soft); color: var(--warning-fg)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <h1 class="el-h1" id="session-title">Sessiya tugadi</h1>
        <p class="el-sub" id="session-text" style="max-width: 300px">Xavfsizlik uchun qayta kirishingiz kerak. Saqlangan ma'lumotlaringiz joyida qoladi.</p>
      </div>

      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius:12px; background: var(--sunken)">
        <span class="el-small el-muted" style="display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg>Sessiya tugagan vaqt</span>
        <span class="el-small el-strong">Bugun, 14:15</span>
      </div>

      <a class="el-btn el-btn-primary el-btn-lg el-btn-block" href="@login">Qayta kirish</a>

    </section>
  </main>

  <footer class="el-small el-subtle" style="padding: 0 16px 24px; text-align: center">© 2026 Elchi Pochta</footer>

</div>
